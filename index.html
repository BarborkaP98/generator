<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abaku generátor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Abaku generátor</h1>

    <div class="buttons">
        <button onclick="generuj(10)">10 číslic</button>
        <button onclick="generuj(13)">13 číslic</button>
        <button onclick="generuj(15)">15 číslic</button>
        <button onclick="generuj(20)">20 číslic</button>
    </div>

    <div id="cisla"></div>

    <h2>Sestavený výraz</h2>

    <div id="vyraz"></div>
    <div id="vysledek"></div>
    <div class="operators">
        <button onclick="pridejOperator('+')">+</button>
        <button onclick="pridejOperator('-')">−</button>
        <button onclick="pridejOperator('⋅')">·</button>
        <button onclick="pridejOperator(':')">:</button>
        <button onclick="pridejOperator('=')">=</button>
    </div>

    <button onclick="vymazat()">
        Vymazat
    </button>
    <button onclick="zkontroluj()">Zkontrolovat</button>
</div>

<script src="script.js"></script>

</body>
</html>
